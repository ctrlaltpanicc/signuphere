
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mailing List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #eee;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 360px;
      padding: 24px;
    }

    .logo {
      width: 100px;
      height: auto;
      display: block;
      margin: 0 auto 34px;
    }

    h1 {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 3px;
      margin: 0 0 12px;
    }

    p {
      color: #777;
      font-size: 12px;
      margin: 0 0 28px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input[type="email"] {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1px solid #333;
      color: #eee;
      font-size: 13px;
      outline: none;
    }

    input[type="email"]:focus {
      border-color: #777;
    }

    input[type="email"]::placeholder {
      color: #666;
    }

    button {
      padding: 13px;
      background: #eee;
      color: #000;
      border: none;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    button:hover {
      background: #ccc;
    }

    .footer {
      margin-top: 18px;
      color: #444;
      font-size: 10px;
    }
  </style>
</head>

<body>
  <main>
    <img
      src="leaf-logo.png"
      alt="Leaf logo"
      class="logo"
    >

    <h1>MAILING LIST</h1>

    <p>Subscribe to the Winter-Fall Catalouge.</p>

    <form
      action="https://buttondown.com/api/emails/embed-subscribe/YOUR_USERNAME"
      method="post"
    >
      <input
        type="email"
        name="email"
        placeholder="Your email address"
        aria-label="Your email address"
        required
      >

      <button type="submit">SUBSCRIBE</button>
    </form>

    <div class="footer">
      UNSUBSCRIBE AT ANY TIME
    </div>
  </main>
</body>
</html>
